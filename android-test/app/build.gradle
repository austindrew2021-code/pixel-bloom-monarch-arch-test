plugins {
    id "com.android.application"
}

android {
    namespace "kitchen.spoonful"
    compileSdk 34
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    defaultConfig {
        applicationId "kitchen.spoonful"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "1.21-live"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ["jpg", "jpeg", "png", "js", "css", "html"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
